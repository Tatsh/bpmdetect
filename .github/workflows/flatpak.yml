jobs:
  build:
    container:
      image: 'ghcr.io/flathub-infra/flatpak-github-actions:kde-6.9'
      options: '--privileged'
    runs-on: '${{ matrix.system.image }}'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - id: 'flatpak_bundle'
        name: 'Set Flatpak bundle filename'
        run: |
          version=$(jq -r '.version' package.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "filename=sh.tat.bpmdetect-${version}-${{ matrix.system.arch }}.flatpak" >> "$GITHUB_OUTPUT"
      - name: 'Build Flatpak'
        uses: 'flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb'
        with:
          arch: '${{ matrix.system.arch }}'
          bundle: '${{ steps.flatpak_bundle.outputs.filename }}'
          manifest-path: 'sh.tat.bpmdetect.yml'
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: 'error'
          name: 'sh.tat.bpmdetect-${{ steps.flatpak_bundle.outputs.version }}-${{ matrix.system.arch }}'
          path: '${{ steps.flatpak_bundle.outputs.filename }}'
      - name: 'Attest'
        uses: 'actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6'
        with:
          subject-path: '${{ steps.flatpak_bundle.outputs.filename }}'
      - env:
          FILENAME: '${{ steps.flatpak_bundle.outputs.filename }}'
          GH_REPO: '${{ github.repository }}'
          GH_TOKEN: '${{ github.token }}'
          TAG: '${{ github.ref_name }}'
        if: "github.ref_type == 'tag'"
        name: 'Upload package'
        run: |
          command -v gh >/dev/null 2>&1 || dnf install -y gh
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --notes '' --title "$TAG" --verify-tag || true
          gh release upload "$TAG" --clobber "$FILENAME"
    strategy:
      matrix:
        system:
          - arch: 'x86_64'
            image: 'ubuntu-latest'
          - arch: 'aarch64'
            image: 'ubuntu-24.04-arm'
name: 'Flatpak'
'on':
  push:
    branches:
      - 'master'
    paths:
      - '.github/workflows/flatpak.yml'
      - 'CMakeLists.txt'
      - 'include/**'
      - 'sh.tat.bpmdetect.yml'
      - 'src/**'
      - 'vcpkg.json'
    tags:
      - 'v*.*.*'
permissions:
  attestations: 'write'
  contents: 'write'
  id-token: 'write'
