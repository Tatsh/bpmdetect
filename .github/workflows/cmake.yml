---
jobs:
  build-macos:
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install deps
        run: brew install extra-cmake-modules ffmpeg qt sound-touch
      - run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=${{matrix.build-type}} \
            --install-prefix ${{github.workspace}}/build/prefix
          cmake --build build --config ${{matrix.build-type}} --verbose
          cmake --install ${{github.workspace}}/build --config ${{matrix.build-type}} --verbose
      - name: Package
        run: >-
          cpack -C ${{matrix.build-type}}
          --config ${{github.workspace}}/build/CPackConfig.cmake --verbose
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: bpmdetect-${{ matrix.build-type }}-${{ matrix.os }}
          path: |
            ${{github.workspace}}/bpmdetect-*.zip
            ${{github.workspace}}/bpmdetect-*.dmg
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/bpmdetect-*.zip
            ${{github.workspace}}/bpmdetect-*.dmg
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' }}
        name: Upload package
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --notes '' --title "$TAG" --verify-tag || true
          gh release upload "$TAG" --clobber bpmdetect-*.zip bpmdetect-*.dmg
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        os: [macos-latest, macos-15-intel]
  build-msys:
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ${{ matrix.sys.runner }}
    steps:
      - id: fixed_workspace
        name: Fix path
        run: >-
          echo out=$("${{github.workspace}}" -Replace "\\","/") | Out-File
          -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - if: matrix.sys.name == 'clangarm64'
        name: Install NSIS via Chocolatey
        run: |
          choco install nsis -y --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          install: >-
            git
            make
            zip
          msystem: ${{matrix.sys.name}}
          pacboy: >-
            cmake:p
            extra-cmake-modules:p
            ffmpeg:p
            ninja:p
            ${{ matrix.sys.name == 'clangarm64' && ' ' || 'nsis:p' }}
            qt6-base:p
            qt6-multimedia:p
            qt6-tools:p
            soundtouch:p
            toolchain:p
            zlib:p
          update: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          OUT: ${{ steps.fixed_workspace.outputs.out }}
        name: Configure
        run: >-
          cmake -G Ninja -B ${OUT}/build
          --install-prefix ${OUT}/build/prefix
          -DBUILD_PLUGIN=${{ matrix.sys.release && 'ON' || 'OFF' }}
          -DCMAKE_BUILD_TYPE=${{matrix.build-type}}
          -DCPACK_SYSTEM_NAME=${{matrix.sys.cpack_system}}
          -DFHS=OFF
          -DPLUGIN_STATIC_SOUNDTOUCH=ON
        shell: msys2 {0}
      - env:
          OUT: ${{ steps.fixed_workspace.outputs.out }}
        name: Build
        run: cmake --build ${OUT}/build --verbose
        shell: msys2 {0}
      - env:
          OUT: ${{ steps.fixed_workspace.outputs.out }}
        name: Install
        run: >-
          cmake --install ${OUT}/build
          --config ${{matrix.build-type}} --verbose
        shell: msys2 {0}
      - env:
          OUT: ${{ steps.fixed_workspace.outputs.out }}
        name: Package
        run: >-
          cpack -C ${{matrix.build-type}}
          --config ${OUT}/build/CPackConfig.cmake --verbose
        shell: msys2 {0}
      - if: ${{ matrix.sys.release && matrix.build-type == 'Release' }}
        name: Package plugin
        run: >-
          cd build/bin &&
          zip -r ../../bpmdetect-plugin-Release-${{matrix.sys.cpack_system}}.zip
          bpmdetect-plugin.clap bpmdetect-plugin.lv2 bpmdetect-plugin.vst3
        shell: msys2 {0}
      - env:
          TAG: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' && matrix.sys.release && matrix.build-type == 'Release' }}
        name: Rename plugin with tag
        run: >-
          mv -v bpmdetect-plugin-Release-${{matrix.sys.cpack_system}}.zip
          bpmdetect-plugin-${TAG}-${{matrix.sys.cpack_system}}.zip
        shell: msys2 {0}
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: bpmdetect-${{ matrix.build-type }}-${{ matrix.sys.name }}
          path: |
            ${{github.workspace}}/bpmdetect-*.exe
            ${{github.workspace}}/bpmdetect-*.zip
            !${{github.workspace}}/bpmdetect-plugin-*.zip
      - if: ${{ matrix.sys.release }}
        name: 'Upload plugin artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: bpmdetect-plugin-${{ matrix.build-type }}-${{ matrix.sys.cpack_system }}
          path: |
            ${{github.workspace}}/build/bin/bpmdetect-plugin.clap
            ${{github.workspace}}/build/bin/bpmdetect-plugin.lv2
            ${{github.workspace}}/build/bin/bpmdetect-plugin.vst3
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/bpmdetect-*.exe
            ${{github.workspace}}/bpmdetect-*.zip
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' && matrix.sys.release }}
        name: Upload package
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --notes '' --title "$TAG" --verify-tag || true
          gh release upload "$TAG" --clobber bpmdetect-*.exe bpmdetect-*.zip
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        sys:
          - cpack_system: win64
            env: x86_64
            name: mingw64
            release: false
            runner: windows-latest
          - cpack_system: win64
            env: ucrt-x86_64
            name: ucrt64
            release: true
            runner: windows-latest
          - cpack_system: winarm64
            env: clang-aarch64
            name: clangarm64
            release: true
            runner: windows-11-arm
  build-linux:
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules gstreamer1.0-libav gstreamer1.0-plugins-bad gstreamer1.0-plugins-base gstreamer1.0-plugins-good lcov libavcodec-dev libavformat-dev libavutil-dev libgl1-mesa-dev libgstreamer-plugins-bad1.0-0 libgstreamer-plugins-base1.0-0 libgstreamer1.0-0 libsoundtouch-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev tree
      - name: Install Qt
        uses: Tatsh/install-qt-action@c06aab43ae9bf6a28175c9cf45dd5936d44e21e9
        with:
          modules: qtmultimedia
      - name: Configure
        run: >-
          cmake -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -B ${{github.workspace}}/build
          --install-prefix ${{github.workspace}}/build/AppDir/usr
          -DBUILD_PLUGIN=ON
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
          -DFHS=ON
          -DPLUGIN_STATIC_SOUNDTOUCH=ON
      - name: Build
        run: cmake --build ${{github.workspace}}/build --verbose --config ${{matrix.build-type}}
      - name: Install
        run: cmake --install ${{github.workspace}}/build --config ${{matrix.build-type}} --verbose
      - name: Package
        run: >-
          cpack -C ${{matrix.build-type}}
          --config ${{github.workspace}}/build/CPackConfig.cmake --verbose
      - name: Package plugin
        run: >-
          cd ${{github.workspace}}/build/bin &&
          zip -r
          ${{github.workspace}}/bpmdetect-plugin-${{matrix.build-type}}-${{matrix.arch.deploy_arch}}.zip
          bpmdetect-plugin.clap bpmdetect-plugin.lv2 bpmdetect-plugin.vst3
      - name: Create AppImage
        env:
          DEPLOY_ARCH: ${{ matrix.arch.deploy_arch }}
          EXTRA_PLATFORM_PLUGINS: 'libqwayland-generic.so;libqwayland-egl.so'
          EXTRA_QT_PLUGINS: 'wayland-decoration-client;wayland-graphics-integration-client;wayland-shell-integration'
        run: |
          wget "https://github.com/TheAssassin/linuxdeploy/releases/download/continuous/linuxdeploy-${DEPLOY_ARCH}.AppImage"
          wget "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${DEPLOY_ARCH}.AppImage"
          chmod +x "linuxdeploy-${DEPLOY_ARCH}.AppImage" "linuxdeploy-plugin-qt-${DEPLOY_ARCH}.AppImage"
          QMAKE="$(command -v qmake6)"
          export QMAKE
          "./linuxdeploy-${DEPLOY_ARCH}.AppImage" --appdir ${{github.workspace}}/build/AppDir --plugin qt --output appimage
          rm "./linuxdeploy-${DEPLOY_ARCH}.AppImage" "./linuxdeploy-plugin-qt-${DEPLOY_ARCH}.AppImage"
          mv -v ${{github.workspace}}/*.AppImage "${{github.workspace}}/bpmdetect-${{matrix.build-type}}-${DEPLOY_ARCH}.AppImage"
      - env:
          TAG: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Rename with tag
        run: |
          mv -v ${{github.workspace}}/bpmdetect-*.AppImage ${{github.workspace}}/bpmdetect-${TAG}-${{matrix.arch.deploy_arch}}.AppImage
          mv -v ${{github.workspace}}/bpmdetect-plugin-*.zip ${{github.workspace}}/bpmdetect-plugin-${TAG}-${{matrix.arch.deploy_arch}}.zip
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: bpmdetect-${{ matrix.build-type }}-Linux-${{ matrix.arch.deploy_arch }}
          path: |
            ${{github.workspace}}/bpmdetect-*.AppImage
            ${{github.workspace}}/bpmdetect-*.zip
            !${{github.workspace}}/bpmdetect-plugin-*.zip
      - name: 'Upload plugin artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: bpmdetect-plugin-${{ matrix.build-type }}-Linux-${{ matrix.arch.deploy_arch }}
          path: |
            ${{github.workspace}}/build/bin/bpmdetect-plugin.clap
            ${{github.workspace}}/build/bin/bpmdetect-plugin.lv2
            ${{github.workspace}}/build/bin/bpmdetect-plugin.vst3
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/bpmdetect-*.AppImage
            ${{github.workspace}}/bpmdetect-*.zip
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Upload package
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --notes '' --title "$TAG" --verify-tag || true
          gh release upload "$TAG" --clobber bpmdetect-*.AppImage bpmdetect-plugin-*.zip
    strategy:
      fail-fast: false
      matrix:
        arch:
          - deploy_arch: aarch64
            runner: ubuntu-24.04-arm
          - deploy_arch: x86_64
            runner: ubuntu-latest
        build-type: [Debug, Release]
  build-plugin-macos:
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up PawPaw
        run: |
          git clone https://github.com/DISTRHO/PawPaw.git
          git -C PawPaw checkout 6ff87c77cf680ab1b18ca36b79e9e09732d34fc3
          ./PawPaw/.github/workflows/bootstrap-deps.sh macos-universal
      - name: Build
        run: |
          source PawPaw/local.env macos-universal
          cmake -S plugin -B build-plugin -DCMAKE_BUILD_TYPE=Release \
            -DPLUGIN_STATIC_SOUNDTOUCH=ON
          cmake --build build-plugin --verbose
      - name: Package plugin
        run: >-
          cd build-plugin/bin &&
          zip -r ${{github.workspace}}/bpmdetect-plugin-Release-macos-universal.zip
          bpmdetect-plugin.clap bpmdetect-plugin.lv2 bpmdetect-plugin.vst3
      - env:
          TAG: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' }}
        name: Rename with tag
        run: >-
          mv -v ${{github.workspace}}/bpmdetect-plugin-Release-macos-universal.zip
          ${{github.workspace}}/bpmdetect-plugin-${TAG}-macos-universal.zip
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: bpmdetect-plugin-Release-macos-universal
          path: |
            ${{github.workspace}}/build-plugin/bin/bpmdetect-plugin.clap
            ${{github.workspace}}/build-plugin/bin/bpmdetect-plugin.lv2
            ${{github.workspace}}/build-plugin/bin/bpmdetect-plugin.vst3
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{github.workspace}}/bpmdetect-plugin-*.zip
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' }}
        name: Upload package
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --notes '' --title "$TAG" --verify-tag || true
          gh release upload "$TAG" --clobber bpmdetect-plugin-*.zip
name: Build
'on':
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master]
permissions: {}
