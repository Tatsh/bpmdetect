---
env:
  CODEQL_EXTRACTOR_CPP_AUTOINSTALL_DEPENDENCIES: 'false'
jobs:
  analyze:
    name: analyse
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules libavcodec-dev libavformat-dev libavutil-dev libsoundtouch-dev
      - name: Install Qt
        uses: Tatsh/install-qt-action@17a12b0f62fdd13c07a77d602b49c24744785e23
        with:
          modules: qtmultimedia
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          category: /language:${{matrix.language}}
    strategy:
      fail-fast: false
      matrix:
        language: ['cpp']
name: CodeQL
'on':
  pull_request:
    branches: ['master']
  push:
    branches: ['master']
  schedule:
    - cron: 42 10 * * 4
