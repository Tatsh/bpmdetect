---
jobs:
  publish-release:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: '${{ github.token }}'
          HEAD_SHA: '${{ github.event.workflow_run.head_sha }}'
          REPO: '${{ github.repository }}'
          TRIGGER_CONCLUSION: '${{ github.event.workflow_run.conclusion }}'
        id: 'guard'
        name: 'Check trigger conditions'
        run: |
          if [[ "$TRIGGER_CONCLUSION" != 'success' ]]; then
            echo "Triggering workflow concluded with '${TRIGGER_CONCLUSION}', nothing to do."
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=''
          while IFS=$'\t' read -r ref obj_type obj_sha; do
            [[ -z "$ref" ]] && continue
            if [[ "$obj_type" == 'commit' ]]; then
              target_sha="$obj_sha"
            else
              target_sha=$(gh api "repos/${REPO}/git/tags/${obj_sha}" \
                --jq '.object.sha' 2>/dev/null || echo '')
            fi
            if [[ "$target_sha" == "$HEAD_SHA" ]]; then
              tag="${ref#refs/tags/}"
              break
            fi
          done < <(gh api "repos/${REPO}/git/matching-refs/tags/v" \
            --jq '.[] | [.ref, .object.type, .object.sha] | @tsv')
          if [[ -z "$tag" ]]; then
            echo "No v* tag points at ${HEAD_SHA}, nothing to do."
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found release tag ${tag} for SHA ${HEAD_SHA}."
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo 'proceed=true' >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: '${{ github.token }}'
          HEAD_SHA: '${{ github.event.workflow_run.head_sha }}'
          TAG: '${{ steps.guard.outputs.tag }}'
        id: 'check'
        if: "steps.guard.outputs.proceed == 'true'"
        name: 'Check all required workflows succeeded'
        run: |
          tag="$TAG"
          sha="$HEAD_SHA"
          all_success=true
          for workflow in Build Flatpak Prettier Snap Spelling Tests clang-format markdownlint; do
            run=$(gh run list --workflow "$workflow" --commit "$sha" --json status,conclusion --jq '.[0]')
            if [[ -z "$run" || "$run" == 'null' ]]; then
              case " Build Flatpak Snap " in
                *" $workflow "*)
                  echo "Workflow '$workflow' has not run for this commit yet; it builds release assets."
                  all_success=false
                  ;;
                *)
                  echo "Workflow '$workflow' did not run for this commit; treating as optional."
                  ;;
              esac
              continue
            fi
            status=$(echo "$run" | jq -r '.status')
            conclusion=$(echo "$run" | jq -r '.conclusion')
            case "$conclusion" in
              failure|cancelled|timed_out|startup_failure|action_required)
                echo "::error::Workflow '$workflow' ${conclusion}."
                exit 1
                ;;
              success|skipped|neutral)
                ;;
              *)
                if [[ "$status" == 'completed' ]]; then
                  echo "::error::Workflow '$workflow' completed with unexpected conclusion '${conclusion}'."
                  exit 1
                fi
                echo "Workflow '$workflow' still pending (status=${status})."
                all_success=false
                ;;
            esac
          done
          if [[ "$all_success" != 'true' ]]; then
            echo 'Not all workflows have completed yet.'
            exit 0
          fi
          echo "All required workflows succeeded for ${tag}."
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: '${{ github.token }}'
          REPO: '${{ github.repository }}'
          TAG: '${{ steps.check.outputs.tag }}'
        if: "steps.check.outputs.ready == 'true'"
        name: 'Verify every expected asset is attached'
        run: |
          version="${TAG#v}"
          required=(
            "bpmdetect-${TAG}-aarch64.AppImage"
            "bpmdetect-${TAG}-x86_64.AppImage"
            "bpmdetect-plugin-${TAG}-aarch64.zip"
            "bpmdetect-plugin-${TAG}-macos-universal.zip"
            "bpmdetect-plugin-${TAG}-win64.zip"
            "bpmdetect-plugin-${TAG}-winarm64.zip"
            "bpmdetect-plugin-${TAG}-x86_64.zip"
            "bpmdetect-${version}-Darwin-*-Debug.dmg"
            "bpmdetect-${version}-Darwin-*-Debug.zip"
            "bpmdetect-${version}-Darwin-*-Release.dmg"
            "bpmdetect-${version}-Darwin-*-Release.zip"
            "bpmdetect-${version}-win64-Debug.exe"
            "bpmdetect-${version}-win64-Debug.zip"
            "bpmdetect-${version}-win64-Release.exe"
            "bpmdetect-${version}-win64-Release.zip"
            "bpmdetect-${version}-winarm64-Debug.exe"
            "bpmdetect-${version}-winarm64-Debug.zip"
            "bpmdetect-${version}-winarm64-Release.exe"
            "bpmdetect-${version}-winarm64-Release.zip"
            "bpmdetect_${version}_amd64.snap"
            "bpmdetect_${version}_arm64.snap"
            "sh.tat.bpmdetect-${version}-aarch64.flatpak"
            "sh.tat.bpmdetect-${version}-x86_64.flatpak"
          )
          mapfile -t attached < <(gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[].name')
          echo "Release ${TAG} has ${#attached[@]} asset(s) attached."
          missing=0
          for pattern in "${required[@]}"; do
            found=''
            for asset in "${attached[@]}"; do
              # shellcheck disable=SC2053
              if [[ "$asset" == $pattern ]]; then
                found="$asset"
                break
              fi
            done
            if [[ -z "$found" ]]; then
              echo "::error::Release ${TAG} has no asset matching '${pattern}'."
              missing=$((missing + 1))
            fi
          done
          if [[ "$missing" -gt 0 ]]; then
            echo "::error::${missing} expected asset(s) missing; ${TAG} stays a draft."
            exit 1
          fi
          echo 'Every expected asset is attached.'
      - env:
          GH_TOKEN: '${{ github.token }}'
          TAG: '${{ steps.check.outputs.tag }}'
        if: "steps.check.outputs.ready == 'true'"
        name: 'Publish release'
        run: 'gh release edit "$TAG" --draft=false'
      - env:
          GH_TOKEN: '${{ github.token }}'
          REPO: '${{ github.repository }}'
          RUN_ID: '${{ github.run_id }}'
        if: 'always()'
        name: 'Delete prior non-publishing Release runs'
        run: |
          delete_run() {
            local id="$1" reason="$2"
            echo "Deleting prior Release run ${id} (${reason})."
            gh run delete --repo "$REPO" "$id" || true
          }
          published_step_skipped() {
            local id="$1"
            local step_conclusion
            step_conclusion=$(gh api "repos/${REPO}/actions/runs/${id}/jobs" \
              --jq '[.jobs[].steps[] | select(.name == "Publish release")][0].conclusion' 2>/dev/null || echo '')
            [[ "$step_conclusion" == 'skipped' ]]
          }
          gh run list --repo "$REPO" --workflow 'Release' \
            --json databaseId,status,conclusion --limit 100 \
            | jq -r --arg self "$RUN_ID" \
                '.[] | select((.databaseId|tostring) != $self) | select(.status == "completed") | [.databaseId, .conclusion] | @tsv' \
            | while IFS=$'\t' read -r id conclusion; do
                [[ -z "$id" ]] && continue
                case "$conclusion" in
                  skipped|cancelled|neutral)
                    delete_run "$id" "$conclusion"
                    ;;
                  success)
                    if published_step_skipped "$id"; then
                      delete_run "$id" 'success without publish'
                    fi
                    ;;
                esac
              done
      - env:
          GH_TOKEN: '${{ github.token }}'
          REPO: '${{ github.repository }}'
          RUN_ID: '${{ github.run_id }}'
        if: "steps.guard.outputs.proceed != 'true' || steps.check.outputs.ready != 'true'"
        name: 'Cancel this run so it can be cleaned up'
        run: |
          echo 'This run did not publish; cancelling so a later run can remove it.'
          gh run cancel --repo "$REPO" "$RUN_ID" || true
          sleep 30
name: 'Release'
'on':
  workflow_run:
    types:
      - 'completed'
    workflows:
      - 'Build'
      - 'Flatpak'
      - 'Prettier'
      - 'Snap'
      - 'Spelling'
      - 'Tests'
      - 'clang-format'
      - 'markdownlint'
permissions:
  actions: 'write'
  contents: 'write'
