---
concurrency:
  cancel-in-progress: false
  group: '${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}'
  queue: 'max'
jobs:
  create-ebuild-pr:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') }}
    name: 'Create ebuild pull request'
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          TAG="$HEAD_BRANCH"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Checkout gentoo/gentoo repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: gentoo
          persist-credentials: false
          repository: gentoo/gentoo
          token: ${{ secrets.GENTOO_TOKEN }}
      - name: Configure git
        run: |
          cd gentoo || exit 1
          git config user.name "Andrew Udvare"
          git config user.email "audvare@gmail.com"
      - name: Create new ebuild
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd gentoo || exit 1
          EBUILD_DIR=media-sound/bpmdetect
          LATEST=$(find "$EBUILD_DIR" -name 'bpmdetect-*.ebuild' 2>/dev/null | sort -V | tail -1)
          cp "$LATEST" "${EBUILD_DIR}/bpmdetect-${VERSION}.ebuild"
          TARBALL_NAME="bpmdetect-${VERSION}.tar.gz"
          TARBALL_PATH="$RUNNER_TEMP/${TARBALL_NAME}"
          curl -fSL -o "$TARBALL_PATH" \
            "https://github.com/Tatsh/bpmdetect/archive/refs/tags/v${VERSION}.tar.gz"
          SIZE=$(stat -c%s "$TARBALL_PATH")
          BLAKE2B=$(b2sum "$TARBALL_PATH" | awk '{print $1}')
          SHA512=$(sha512sum "$TARBALL_PATH" | awk '{print $1}')
          MANIFEST="${EBUILD_DIR}/Manifest"
          NEW_LINE="DIST ${TARBALL_NAME} ${SIZE} BLAKE2B ${BLAKE2B} SHA512 ${SHA512}"
          if [[ -f "$MANIFEST" ]]; then
            grep -v "^DIST ${TARBALL_NAME} " "$MANIFEST" > "${MANIFEST}.tmp" || true
          else
            : > "${MANIFEST}.tmp"
          fi
          echo "$NEW_LINE" >> "${MANIFEST}.tmp"
          LC_ALL=C sort -o "$MANIFEST" "${MANIFEST}.tmp"
          rm "${MANIFEST}.tmp"
      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GENTOO_TOKEN }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd gentoo || exit 1
          base_repo='gentoo/gentoo'
          fork='Tatsh/gentoo'
          branch="bpmdetect-${VERSION}"
          title="media-sound/bpmdetect: add ${VERSION}"
          git checkout -B "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo 'The ebuild is already present.'
            exit 0
          fi
          git commit -s -m "$title"
          gh auth setup-git
          git push --force "https://github.com/${fork}.git" "HEAD:refs/heads/${branch}"
          existing=$(gh pr list --repo "$base_repo" --head "$branch" --state open \
            --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            echo "Pull request #${existing} exists; its branch was updated."
            exit 0
          fi
          body_file="${RUNNER_TEMP}/pr-body.md"
          {
            printf 'This PR was automatically created by the [BPM Detect release workflow](%s).\n\n' \
              "$RUN_URL"
            printf 'Signed-off-by: Andrew Udvare <audvare@gmail.com>\n\n'
            printf 'Release: https://github.com/%s/releases/tag/%s\n\n' "$GITHUB_REPOSITORY" "$TAG"
            cat <<'EOF'
          * [x] I can submit this contribution in agreement with the [Copyright Policy](https://www.gentoo.org/glep/glep-0076.html#certificate-of-origin).
          * [x] I have certified the above via adding a `Signed-off-by` line to _every_ commit in the pull request.
          * [x] This contribution has not been created with the assistance of Natural Language Processing artificial intelligence tools, in accordance with the [AI policy](https://wiki.gentoo.org/wiki/Project:Council/AI_policy).
          * [x] I have run `pkgcheck scan --commits --net` to check for issues with my commits.
          EOF
          } > "$body_file"
          gh pr create --repo "$base_repo" --base master --head "${fork%%/*}:${branch}" \
            --title "$title" --body-file "$body_file"
name: Add new ebuild to Portage
'on':
  workflow_run:
    workflows:
      - 'Release'
    types:
      - 'completed'
permissions: {}
